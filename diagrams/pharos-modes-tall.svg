<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 560" width="340" height="560" class="flow-svg" data-flow-svg="pharos-modes" data-layout="tall" role="presentation"><style>
.n rect{fill:#111821;stroke:#35414e;stroke-width:1.5}
.n text{fill:#f0e9e3;font:600 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-anchor:middle}
.n text.s{fill:#a9b4be;font:400 11.5px ui-monospace,'SFMono-Regular',Menlo,monospace}
.n[data-tone=actor] rect{stroke:#d9a17a}
.n[data-tone=store] rect{stroke-dasharray:6 3}
.n[data-tone=external] rect{stroke-dasharray:2 3}
.n[data-tone=check] rect{stroke:#4f8f97}
.n[data-tone=valerie] rect{stroke:#a74051}
.n[data-tone=model] rect{stroke:#d598ac;stroke-dasharray:6 3}
.n[data-tone=refuse] rect{stroke:#8a5563}
.e{fill:none;stroke:#35414e;stroke-width:1.5}
.l{fill:#a9b4be;font:400 11px ui-monospace,'SFMono-Regular',Menlo,monospace;text-anchor:middle}
.p{opacity:0}.p circle{fill:#73dde8}.p text{fill:#73dde8;font:600 11px ui-monospace,'SFMono-Regular',Menlo,monospace}
</style><defs><marker id="pharos-modes-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" fill="#5d6b78"/></marker></defs><g class="edges"><g class="e-g" data-edge="ask"><path class="e" id="pharos-modes-e-ask" d="M170 62 V106" marker-end="url(#pharos-modes-arrow)"/><text class="l" style="text-anchor:start" x="178" y="88">request</text></g><g class="e-g" data-edge="to-dense"><path class="e" id="pharos-modes-e-to-dense" d="M100 130 H14 V250 H121" marker-end="url(#pharos-modes-arrow)"/><text class="l" style="text-anchor:end" x="113" y="243">auto, no hints</text></g><g class="e-g" data-edge="to-hybrid"><path class="e" id="pharos-modes-e-to-hybrid" d="M240 130 H326 V330 H261.5" marker-end="url(#pharos-modes-arrow)"/><text class="l" style="text-anchor:start" x="270" y="323">auto + hints</text></g><g class="e-g" data-edge="to-keyword"><path class="e" id="pharos-modes-e-to-keyword" d="M100 130 H22 V410 H114" marker-end="url(#pharos-modes-arrow)"/><text class="l" style="text-anchor:end" x="106" y="403">no embedder</text></g><g class="e-g" data-edge="to-refused"><path class="e" id="pharos-modes-e-to-refused" d="M240 130 H318 V500 H236.5" marker-end="url(#pharos-modes-arrow)"/><text class="l" style="text-anchor:start" x="245" y="493">named, can’t run</text></g></g><g class="nodes"><g class="n" id="pharos-modes-n-caller" data-node="caller" data-tone="actor"><rect x="117.5" y="14" width="105" height="48" rx="5"/><text x="170" y="34">Caller</text><text class="s" x="170" y="51">mode, hints</text></g><g class="n" id="pharos-modes-n-router" data-node="router" data-tone="check"><rect x="100" y="106" width="140" height="48" rx="5"/><text x="170" y="126">Mode router</text><text class="s" x="170" y="143">is dense usable?</text></g><g class="n" id="pharos-modes-n-dense" data-node="dense" data-tone="system"><rect x="121" y="226" width="98" height="48" rx="5"/><text x="170" y="246">Dense</text><text class="s" x="170" y="263">by meaning</text></g><g class="n" id="pharos-modes-n-hybrid" data-node="hybrid" data-tone="system"><rect x="78.5" y="306" width="183" height="48" rx="5"/><text x="170" y="326">Hybrid</text><text class="s" x="170" y="343">names + meaning, fused</text></g><g class="n" id="pharos-modes-n-keyword" data-node="keyword" data-tone="system"><rect x="114" y="386" width="112" height="48" rx="5"/><text x="170" y="406">Keyword</text><text class="s" x="170" y="423">BM25 by name</text></g><g class="n" id="pharos-modes-n-refused" data-node="refused" data-tone="refuse"><rect x="103.5" y="476" width="133" height="48" rx="5"/><text x="170" y="496">Refused</text><text class="s" x="170" y="513">ModeUnavailable</text></g></g><g class="p" id="pharos-modes-packet"><circle r="6"/><text x="-9" y="-10" style="text-anchor:end"></text></g></svg>