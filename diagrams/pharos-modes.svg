.n[data-tone=external] rect{stroke-dasharray:2 3}
.n[data-tone=check] rect{stroke:#4f8f97}
.n[data-tone=valerie] rect{stroke:#a74051}
.n[data-tone=model] rect{stroke:#d598ac;stroke-dasharray:6 3}
.n[data-tone=refuse] rect{stroke:#8a5563}
.e{fill:none;stroke:#35414e;stroke-width:1.5}
.l{fill:#a9b4be;font:400 11px ui-monospace,'SFMono-Regular',Menlo,monospace;text-anchor:middle}
.p{opacity:0}.p circle{fill:#73dde8}.p text{fill:#73dde8;font:600 11px ui-monospace,'SFMono-Regular',Menlo,monospace}
