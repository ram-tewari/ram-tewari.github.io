lass="s" x="730" y="53">by meaning</text></g><g class="n" id="pharos-modes-n-hybrid" data-node="hybrid" data-tone="system"><rect x="638.5" y="83" width="183" height="48" rx="5"/><text x="730" y="103">Hybrid</text><text class="s" x="730" y="120">names + meaning, fused</text></g><g class="n" id="pharos-modes-n-keyword" data-node="keyword" data-tone="system"><rect x="674" y="150" width="112" height="48" rx="5"/><text x="730" y="170">Keyword</text><text class="s" x="730" y="187">BM25 by name</text></g><g class="n" id="pharos-modes-n-refused" data-node="refused" data-tone="refuse"><rect x="663.5" y="217" width="133" height="48" rx="5"/><text x="730" y="237">Refused</text><text class="s" x="730" y="254">ModeUnavailable</text></g></g><g class="p" id="pharos-modes-packet"><circle r="6"/><text x="-9" y="-10" style="text-anchor:end"></text></g></svg>