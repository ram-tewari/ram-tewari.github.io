move-n-visitor" data-node="visitor" data-tone="actor"><rect x="96" y="12" width="148" height="48" rx="5"/><text x="170" y="32">You</text><text class="s" x="170" y="49">a line or a click</text></g><g class="n" id="valerie-move-n-proposer" data-node="proposer" data-tone="model"><rect x="78.5" y="80" width="183" height="48" rx="5"/><text x="170" y="100">Proposer</text><text class="s" x="170" y="117">phrase matcher · model</text></g><g class="n" id="valerie-move-n-move" data-node="move" data-tone="system"><rect x="107" y="148" width="126" height="48" rx="5"/><text x="170" y="168">Typed move</text><text class="s" x="170" y="185">{ tool, args }</text></g><g class="n" id="valerie-move-n-guard" data-node="guard" data-tone="check"><rect x="96" y="216" width="148" height="48" rx="5"/><text x="170" y="236">Guard</text><text class="s" x="170" y="253">plain data · copy</text></g><g class="n" id="valerie-move-n-session" data-node="session" data-tone="check"><rect x="110" y="284" width="120" height="48" rx="5"/><text x="170" y="304">Session</text><text class="s" x="170" y="321">generation</text></g><g class="n" id="valerie-move-n-tool" data-node="tool" data-tone="check"><rect x="110" y="352" width="120" height="48" rx="5"/><text x="170" y="372">Tool</text><text class="s" x="170" y="389">closed list</text></g><g class="n" id="valerie-move-n-args" data-node="args" data-tone="check"><rect x="110" y="420" width="120" height="48" rx="5"/><text x="170" y="440">Arguments</text><text class="s" x="170" y="457">exact keys</text></g><g class="n" id="valerie-move-n-allowed" data-node="allowed" data-tone="check"><rect x="110" y="488" width="120" height="48" rx="5"/><text x="170" y="508">Allowed</text><text class="s" x="170" y="525">this turn</text></g><g class="n" id="valerie-move-n-outside" data-node="outside" data-tone="check"><rect x="108" y="556" width="124" height="48" rx="5"/><text x="170" y="576">Outside text</text><text class="s" x="170" y="593">explains only</text></g><g class="n" id=